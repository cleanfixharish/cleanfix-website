name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m alembic upgrade head
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-migration.db

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: app/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag cleanfixharish:migration-check .
      - name: Verify production static assets are packaged
        run: |
          docker run --rm --entrypoint sh cleanfixharish:migration-check -c '
            test -s /app/app/frontend/dist/assets/brand/cf-gold-monogram-128.png &&
            test -s /app/app/frontend/dist/assets/images/cleanfix-documentary/web/hero-managed-service-768.webp &&
            test -s /app/app/frontend/dist/assets/images/cleanfix-mobile-v3/web/handyman-shelf-768.webp &&
            test -s /app/app/frontend/dist/assets/images/transformations/garden-hillside-cascade-1536.webp
          '
